<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JETHA symbol in black (src/assets/brand/jetha-symbol-black.png at 128 px). In dark browser themes a cream tile sits behind it so the black symbol stays visible. -->
  <style>.tile{display:none}@media (prefers-color-scheme: dark){.tile{display:inline}}</style>
  <rect class="tile" width="128" height="128" rx="24" fill="#f5e4ce"/>
  <image width="128" height="128" href="data:image/png;base64,"/>
</svg>
